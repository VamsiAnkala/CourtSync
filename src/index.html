<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CourtSync</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <script>
    (function () {
      try {
        var s = localStorage.getItem('courtsync-theme');
        var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1220');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="boot" class="splash" role="status" aria-live="polite" aria-label="Loading CourtSync">
    <div class="splash-inner">
      <div class="splash-stage" aria-hidden="true">
        <svg class="splash-net" width="6" height="52" viewBox="0 0 6 52"><path d="M3 0v52" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/></svg>
        <svg class="splash-racket left" width="44" height="64" viewBox="0 0 44 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><ellipse cx="22" cy="20" rx="14" ry="18"/><path d="M22 2v36M10 12h24M8 20h28M10 28h24" stroke-width="1" opacity=".55"/><path d="M22 38v24" stroke-width="4"/></svg>
        <svg class="splash-racket right" width="44" height="64" viewBox="0 0 44 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><ellipse cx="22" cy="20" rx="14" ry="18"/><path d="M22 2v36M10 12h24M8 20h28M10 28h24" stroke-width="1" opacity=".55"/><path d="M22 38v24" stroke-width="4"/></svg>
        <div class="sc-x">
          <span class="sc-shadow"></span>
          <div class="sc-y">
            <svg class="sc-shuttle" width="22" height="28" viewBox="0 0 22 28"><path d="M6.5 22 1.5 3Q11-1 20.5 3L15.5 22Z" fill="#fff" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round"/><path d="M7 5.5Q11 8 15 5.5M6.5 11Q11 13.5 15.5 11M6 17Q11 19.5 16 17M11 3v19" fill="none" stroke="#cbd5e1" stroke-width="1"/><circle cx="11" cy="23.5" r="4" fill="#f59e0b" stroke="#b45309" stroke-width="1"/></svg>
          </div>
        </div>
      </div>
      <div class="splash-brand">
        <span class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="96 136 320 240" fill="none" stroke="currentColor" stroke-width="26" stroke-linejoin="round"><rect x="96" y="136" width="320" height="240" rx="16"/><path d="M256 136v240"/><circle cx="256" cy="256" r="30" fill="currentColor"/></svg>
        </span>
        <span class="font-display">CourtSync</span>
      </div>
      <p class="splash-msgs">
        <span>Stringing the rackets…</span>
        <span>Chasing the shuttle…</span>
        <span>Arguing over who books the court…</span>
        <span>Pretending to warm up…</span>
        <span>Calling a let…</span>
        <span>Counting who's actually coming…</span>
      </p>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
